{% extends "base_app.html" %}{% block title %}Login | Best Cars{% endblock %}{% block content %}<main class="wrap"><section class="hero"><h1>Welcome back</h1><p>Sign in to review a dealership.</p></section><div class="card"><form id="loginForm" class="form-grid"><label>Username<input id="username" value="dat28062006" required></label><label>Password<input id="password" type="password" value="BestCars!2026" required></label><button class="btn">Login</button></form><p id="error" class="muted"></p></div></main>{% endblock %}{% block scripts %}<script>document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const r=await fetch('/djangoapp/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userName:username.value,password:password.value})});const j=await r.json();if(r.ok){sessionStorage.setItem('username',j.userName);sessionStorage.setItem('firstname',j.firstName||'Dat');sessionStorage.setItem('lastname',j.lastName||'Tran');location.href='/dealers/'}else error.textContent=j.message}</script>{% endblock %}
