<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Best Cars{% endblock %}</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f4f7fb;color:#17233b}nav{height:82px;background:linear-gradient(100deg,#006d77,#0bb3bd);color:#fff;display:flex;align-items:center;padding:0 5%;gap:32px;box-shadow:0 4px 14px #0002}nav strong{font-size:25px;margin-right:auto}nav a{color:#fff;text-decoration:none;font-weight:600;padding:12px 6px}.user{background:#ffffff22;border-radius:18px;padding:8px 14px}.wrap{max-width:1180px;margin:36px auto;padding:0 20px}.hero{background:linear-gradient(135deg,#fff,#e8fbfc);padding:28px 32px;border-radius:18px;margin-bottom:24px;box-shadow:0 8px 24px #00304914}.hero h1{margin:0 0 8px;color:#075b63}.card{background:#fff;border-radius:16px;box-shadow:0 8px 24px #243b5317;padding:24px}.btn{display:inline-block;background:#0b8f99;color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:700;text-decoration:none;cursor:pointer}.btn.secondary{background:#eef8f9;color:#075b63}.table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;background:#fff;border-radius:14px;box-shadow:0 8px 22px #1e344914}.table th{background:#075b63;color:#fff;text-align:left;padding:14px}.table td{padding:14px;border-bottom:1px solid #e7edf2}.table tr:hover td{background:#f2fbfc}.table a{color:#087b85;font-weight:700}.filters{display:flex;align-items:center;gap:12px;margin-bottom:18px}.filters select,input,textarea{border:1px solid #bfd1dd;border-radius:9px;padding:11px;font:inherit}.reviews{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.review{border-left:6px solid #0b9ea7}.review .sentiment{font-size:13px;text-transform:uppercase;font-weight:800;color:#07828b}.form-grid{display:grid;gap:16px;max-width:720px}.form-grid label{font-weight:700;display:grid;gap:7px}.muted{color:#617083}.notice{background:#e8f8ee;color:#176c39;padding:12px;border-radius:10px}.hidden{display:none}
</style></head><body>
<nav><strong>Best Cars Dealerships</strong><a href="/">Home</a><a href="/about/">About Us</a><a href="/contact/">Contact Us</a><a href="/dealers/">Dealers</a><span class="user" id="userBox"><a href="/login/">Login</a> · <a href="/register/">Register</a></span></nav>
{% block content %}{% endblock %}
<script>const currentUser=sessionStorage.getItem('username');if(currentUser){document.getElementById('userBox').innerHTML='<b>'+currentUser+'</b> · <a href="#" onclick="logoutUser()">Logout</a>'}async function logoutUser(){await fetch('/djangoapp/logout');sessionStorage.clear();location.href='/'}</script>
{% block scripts %}{% endblock %}</body></html>
