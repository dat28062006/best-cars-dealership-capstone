{% extends "base_app.html" %}{% block title %}Register | Best Cars{% endblock %}{% block content %}<main class="wrap"><section class="hero"><h1>Create your Best Cars account</h1><p>Register to add transparent dealership reviews.</p></section><div class="card"><form id="registerForm" class="form-grid"><label>Username<input id="username" required></label><label>First Name<input id="firstName" required></label><label>Last Name<input id="lastName" required></label><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn">Register</button></form></div></main>{% endblock %}{% block scripts %}<script>document.getElementById('registerForm').onsubmit=async e=>{e.preventDefault();const body={userName:username.value,firstName:firstName.value,lastName:lastName.value,email:email.value,password:password.value};const r=await fetch('/djangoapp/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(r.ok){sessionStorage.setItem('username',j.userName);location.href='/dealers/'}else alert(j.message)}</script>{% endblock %}
