{% extends "base_app.html" %}{% block title %}Review {{ dealer.full_name }} | Best Cars{% endblock %}{% block content %}
<main class="wrap"><section class="hero"><h1>Review {{ dealer.full_name }}</h1><p>Tell other customers about your dealership experience.</p></section><div class="card"><form id="reviewForm" class="form-grid"><label>Your review<textarea id="review" rows="5" required>Fantastic services, transparent pricing, and a friendly team.</textarea></label><label>Purchase date<input id="date" type="date" value="2026-08-06" required></label><label>Car make and model<select id="model"><option>Toyota Camry</option><option>Ford Explorer</option><option>Honda Civic</option></select></label><label>Car year<input id="year" type="number" min="2015" max="2026" value="2023"></label><button class="btn" type="submit">Post Review</button></form><div id="status" class="notice hidden">Review posted successfully.</div></div></main>
{% endblock %}{% block scripts %}<script>document.getElementById('reviewForm').onsubmit=async e=>{e.preventDefault();const parts=document.getElementById('model').value.split(' ');const response=await fetch('/djangoapp/add_review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:sessionStorage.getItem('username')||'dat28062006',dealership:{{ dealer.id }},review:document.getElementById('review').value,purchase:true,purchase_date:document.getElementById('date').value,car_make:parts[0],car_model:parts[1],car_year:document.getElementById('year').value})});if(response.ok){document.getElementById('reviewForm').classList.add('hidden');document.getElementById('status').classList.remove('hidden');setTimeout(()=>location.href='/dealer/{{ dealer.id }}/',900)}};</script>{% endblock %}
